<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Lifewood</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="log.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            /* Reverting to your original brand colors */
            --brand-green: #046241; 
            --brand-orange: #ffb347; 
            --light-bg: #ffffff; 
            --dark-text: #1f2937; 
            --light-text: #6b7280;
            --error-red: #ef4444;
            --input-border: #d1d5db;
        }
        
        html {
            height: 100%;
        }
        
        body { 
            margin: 0; 
            height: 100%;
            font-family: 'Poppins', sans-serif; 
            background-color: var(--light-bg); 
            color: var(--dark-text); 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Split Screen Layout ===== */
        .split-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .image-pane {
            /* Using a new green gradient overlay */
            background-image: 
                linear-gradient(160deg, var(--brand-orange)),
                url('https://images.unsplash.com/photo-1521737711867-e3b97375f902?q=80&w=1887&auto=format&fit=crop');
            
            background-blend-mode: multiply;
            background-size: cover;
            background-position: center;
            min-height: 250px;
            /* ===== THIS IS THE MODIFIED PART (1 of 2) - Making image pane larger ===== */
            flex: 1.8; 
        }

        .login-pane {
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            /* ===== THIS IS THE MODIFIED PART (2 of 2) - Making login pane smaller ===== */
            flex: 1;
        }
        
        /* Desktop layout */
        @media (min-width: 992px) {
            .split-container {
                flex-direction: row;
            }
            .image-pane {
                min-height: 100vh;
            }
        }
        
        .login-box {
            width: 100%;
            max-width: 380px;
            transition: transform 0.3s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); }
            30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); }
        }
        .shake {
            animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
        }

        .login-box h2 { 
            font-size: 2.25em; font-weight: 700; 
            margin-bottom: 35px; text-align: left;
        }

        .form-group { 
            margin-bottom: 30px; 
        }

        .form-label {
            display: block; margin-bottom: 8px; font-weight: 500;
            font-size: 0.875rem; color: var(--light-text);
        }

        .form-input { 
            width: 100%; padding: 8px 1px; border: none;
            border-bottom: 1px solid var(--input-border);
            background-color: transparent; font-family: 'Poppins', sans-serif; 
            font-size: 1rem; transition: border-color 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--brand-orange); /* Using brand orange for focus */
        }
        .form-input::placeholder {
            color: var(--input-border); font-weight: 400;
        }
        
        /* ===== Gradient Button Styling from Image ===== */
        .login-button { 
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 100%; min-height: 50px;
            padding: 12px 30px; 
            background-color: var(--brand-orange); /* Using brand orange for button */
            color: var(--brand-green); /* Using brand green for text */
            font-weight: 700; /* Bolder text for contrast */
            border-radius: 50px; border: none; 
            cursor: pointer; transition: all 0.3s ease; 
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-button:hover:not(:disabled) {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transform: translateY(-1px);
        }
        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== Button Loader ===== */
        .loader {
            width: 20px; height: 20px; border: 3px solid rgba(4, 98, 65, 0.3); /* Green loader */
            border-top-color: var(--brand-green); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message { 
            color: var(--error-red); margin-top: 15px; font-size: 0.875rem;
            font-weight: 500; height: 20px; text-align: left;
        }

        .back-to-home-link {
            display: inline-block; margin-top: 30px; color: var(--light-text);
            text-decoration: none; font-size: 0.875rem; font-weight: 500;
            transition: color 0.2s;
        }
        .back-to-home-link:hover { color: var(--brand-orange); } /* Using brand orange for hover */

    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left Image Pane -->
        <div class="image-pane"></div>

        <!-- Right Login Pane -->
        <div class="login-pane">
            <div class="login-box" id="loginBox">
                <h2>Admin Login</h2>
                <form id="adminLoginForm" novalidate>
                    <div class="form-group">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" id="username" class="form-input" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••••" required>
                    </div>

                    <button type="submit" class="login-button" id="loginButton">
                        <span class="button-text">Login</span>
                    </button>
                    
                    <div id="errorMessage" class="error-message"></div>
                </form>
                <a href="index.html" class="back-to-home-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        // PASTE YOUR FIREBASE CONFIG OBJECT HERE
        const firebaseConfig = {
          apiKey: "AIzaSyCaxTZTSP_Q1z77VvF7vxpjzth_1oShhws",
          authDomain: "lifewood-app.firebaseapp.com",
          projectId: "lifewood-app",
          storageBucket: "lifewood-app.appspot.com",
          messagingSenderId: "141075525037",
          appId: "1:141075525037:web:9b236d3367024528088524",
          measurementId: "G-CB8L8WS3NJ"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- DOM Elements ---
        const loginForm = document.getElementById('adminLoginForm');
        const loginBox = document.getElementById('loginBox');
        const loginButton = document.getElementById('loginButton');
        const buttonText = loginButton.querySelector('.button-text');
        const errorMessageDiv = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorMessageDiv.textContent = '';
            loginBox.classList.remove('shake');
            setLoading(true);

            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    window.location.href = 'admin-dashboard.html';
                })
                .catch((error) => {
                    errorMessageDiv.textContent = 'Invalid email or password.';
                    loginBox.classList.add('shake');
                    console.error("Authentication Error:", error);
                })
                .finally(() => {
                    setLoading(false);
                });
        });
        
        function setLoading(isLoading) {
            loginButton.disabled = isLoading;
            buttonText.style.visibility = isLoading ? 'hidden' : 'visible';
            
            if (isLoading) {
                if (!loginButton.querySelector('.loader')) {
                    const loader = document.createElement('div');
                    loader.className = 'loader';
                    loginButton.appendChild(loader);
                }
            } else {
                const loader = loginButton.querySelector('.loader');
                if (loader) loader.remove();
            }
        }
    </script>
</body>
</html>
